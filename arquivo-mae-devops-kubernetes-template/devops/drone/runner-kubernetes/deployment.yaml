apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-runner
  namespace: drone-runner
  labels:
    app.kubernetes.io/name: drone-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drone-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone-runner
    spec:
      serviceAccountName: drone-runner
      containers:
        - name: runner
          image: drone/drone-runner-kube:{{VERSAO_FIXADA}}
          imagePullPolicy: IfNotPresent
          env:
            - name: DRONE_RPC_HOST
              value: "{{DRONE_RPC_HOST_SEM_PROTOCOLO}}"
            - name: DRONE_RPC_PROTO
              value: "https"
            - name: DRONE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: drone-runner-rpc
                  key: rpc-secret
            - name: DRONE_RUNNER_NAME
              value: "{{NOME_DO_RUNNER}}"
            - name: DRONE_RUNNER_CAPACITY
              value: "2"
            - name: DRONE_NAMESPACE_DEFAULT
              value: "drone-runner"
            - name: DRONE_POLICY_FILE
              value: "/etc/drone/policy.yml"
            - name: DRONE_RESOURCE_REQUEST_CPU
              value: "100"
            - name: DRONE_RESOURCE_REQUEST_MEMORY
              value: "128Mi"
            - name: DRONE_RESOURCE_LIMIT_CPU
              value: "1000"
            - name: DRONE_RESOURCE_LIMIT_MEMORY
              value: "1Gi"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: policy
              mountPath: /etc/drone/policy.yml
              subPath: policy.yml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policy
          configMap:
            name: drone-runner-policy
