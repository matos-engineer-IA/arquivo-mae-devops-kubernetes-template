apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app-template-staging

resources:
  - ../../base

configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - LOG_LEVEL=info

patches:
  - target:
      kind: Deployment
      name: app-template
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
